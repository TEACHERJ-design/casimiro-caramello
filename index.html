<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casimiro & Caramello — La chiave scomparsa</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff}body{background:#130b2b}.scene{min-height:100dvh;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;padding:26px 16px;overflow:hidden}.scene:before{content:'';position:absolute;inset:0;z-index:-2;background-image:linear-gradient(90deg,rgba(15,7,32,.64),rgba(12,5,30,.34)),var(--bg);background-size:cover;background-position:center;animation:camera 25s ease-in-out infinite alternate}.scene:after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 50%,transparent 15%,rgba(11,5,24,.50) 90%);pointer-events:none}@keyframes camera{from{transform:scale(1)}to{transform:scale(1.09)}}.spark{position:absolute;top:-15%;left:var(--x);font-size:var(--size);opacity:.7;pointer-events:none;animation:float var(--dur) linear infinite;animation-delay:var(--delay)}@keyframes float{to{transform:translateY(120vh) rotate(200deg);opacity:0}}.layout{width:min(1050px,100%);position:relative}.header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.wood{background:linear-gradient(155deg,#783a25,#442038 55%,#3b205d);border:3px solid #f5b54e;box-shadow:0 8px 0 #211025,0 12px 40px #08020ba6;border-radius:20px}.panel{width:min(630px,100%);margin:auto;padding:clamp(17px,3vw,32px);text-align:center;background:linear-gradient(140deg,rgba(39,19,64,.96),rgba(36,18,53,.94));border:3px solid #f2b94b;border-radius:26px;box-shadow:0 16px 65px #000b;backdrop-filter:blur(4px)}.intro-panel{margin-left:auto;margin-right:0;max-width:570px}.title{font-weight:1000;font-size:clamp(2rem,5.6vw,4rem);line-height:1.05;color:#ffdf79;text-shadow:0 4px 0 #70351d,0 7px 10px #0009;margin:0}.subtitle{font-size:clamp(1.1rem,2.4vw,1.6rem);color:#fff1c8}.badge{display:inline-block;padding:7px 18px;border-radius:14px;background:#6c3076;border:2px solid #f9c76c;font-weight:900}.character{position:absolute;left:0;bottom:5%;font-size:clamp(4rem,13vw,10rem);filter:drop-shadow(0 8px 12px #0008);animation:bob 3s ease-in-out infinite;pointer-events:none}.character.two{left:10%;bottom:0%;font-size:clamp(2.8rem,9vw,6rem);animation-delay:-1s}@keyframes bob{50%{transform:translateY(-18px) rotate(-4deg)}}.question{background:#fff0c8;color:#3b2452;border:4px solid #a76539;border-radius:20px;padding:16px;margin:18px auto;box-shadow:0 7px #432238;font-size:clamp(1.2rem,2.4vw,1.55rem);line-height:1.45}.math{font-size:clamp(2.6rem,6vw,4.5rem);font-weight:900;color:#2f1e52}.button{background:linear-gradient(#80f560,#149b35);border:3px solid #d2ff97;color:#123b17;border-radius:17px;padding:13px 25px;font-size:1.15rem;font-weight:900;box-shadow:0 6px 0 #075321;cursor:pointer;transition:transform .15s}.button:hover{transform:translateY(-2px)}.button:active{transform:translateY(3px);box-shadow:0 3px 0 #075321}.button.alt{background:linear-gradient(#ba8dfb,#6330b5);border-color:#e5c8ff;color:white;box-shadow:0 5px 0 #321261}.button.gold{background:linear-gradient(#ffeeb1,#edaf37);border-color:#fff4ca;color:#54290c;box-shadow:0 5px 0 #88501e}.button.choice{min-width:110px;background:linear-gradient(#a15ff6,#4b2b89);color:white;border-color:#d5a9ff;box-shadow:0 4px 0 #2b1451}.button.choice.selected{background:linear-gradient(#ffc86a,#ec8a22);border-color:#fff0b2;color:#512313}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px auto}.input{background:#fff5e5;color:#291842;border:3px solid #d99b5b;border-radius:14px;font-size:1.25rem;padding:13px 15px;width:min(100%,360px);margin:8px 0 14px}.input:focus,.button:focus-visible{outline:4px solid #fff;outline-offset:3px}.controls{display:flex;gap:8px}.tiny{font-size:.85rem;padding:9px 12px;border-radius:100px}.track{display:flex;gap:8px;margin:16px 0}.dot{height:15px;border-radius:20px;background:#644a77;flex:1;border:1px solid #9a7b9f}.dot.done{background:#ffcb51}.info{background:#45235e;border:2px solid #b685d4;padding:13px;border-radius:15px;margin:12px auto;max-width:540px}.status{min-height:26px;font-weight:900;color:#ffde80}.grid{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:5px;margin:10px}.grid span{padding:8px;background:#f4e8ce;color:#3b2452;border-radius:7px}.grid .head{background:#ffcd64}.credit{margin-top:18px;font-weight:bold;color:#ffe1a0;text-shadow:0 2px 6px #000}.float-pumpkin{position:absolute;right:2%;bottom:2%;font-size:clamp(3rem,8vw,6rem);animation:bob 4s infinite}.success-burst{font-size:5rem;animation:pop .8s ease-in-out infinite alternate}@keyframes pop{to{transform:scale(1.15) rotate(8deg)}}.feedback{animation:appear .35s both}@keyframes appear{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:850px){.character{opacity:.6;left:-5%;bottom:0}.character.two{opacity:.5}.intro-panel{margin:auto}.panel{position:relative;z-index:1}}@media(max-width:550px){.scene{padding:12px 8px}.panel{padding:14px}.character{opacity:.2}.character.two{opacity:.2}.header{flex-wrap:wrap}.button{padding:11px 14px;font-size:1rem}}

.final-stage{min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.final-characters{display:flex;justify-content:center;align-items:end;gap:clamp(4px,2vw,20px);margin:10px auto}.final-characters span{display:inline-block;font-size:clamp(3rem,9vw,6.5rem);filter:drop-shadow(0 10px 9px #0009);animation:dance .55s ease-in-out infinite alternate}.final-characters span:nth-child(2){animation-delay:-.27s}.final-characters span:nth-child(3){animation-delay:-.14s;animation-name:flydance}.final-characters span:nth-child(4){animation-delay:-.4s}.lyric{background:#fff0c8;color:#49255b;border-radius:18px;padding:12px 18px;min-height:68px;font-size:clamp(1.1rem,2.7vw,1.7rem);font-weight:900;max-width:560px;margin:10px auto;box-shadow:0 5px 0 #b86d35}.confetti{position:absolute;top:-10vh;left:var(--left);font-size:var(--sz);animation:confettiFall var(--speed) linear infinite;animation-delay:var(--delay);pointer-events:none;z-index:3}@keyframes confettiFall{to{transform:translateY(120vh) rotate(720deg)}}@keyframes dance{to{transform:translateY(-22px) rotate(13deg) scale(1.08)}}@keyframes flydance{to{transform:translateY(-40px) rotate(-18deg) scale(1.1)}}.final-title{font-size:clamp(2rem,5vw,3.8rem)}.diploma{background:linear-gradient(145deg,#fff9d8,#fff1bd);color:#45244d;border:12px double #ba8031;border-radius:20px;max-width:730px;margin:20px auto;padding:24px;text-align:center;box-shadow:0 14px 55px #0008}.diploma h2{font-size:clamp(2rem,5vw,3.2rem);color:#814c17;margin:10px 0}.diploma .recipient{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:1000;color:#6d2787;margin:18px 0}.diploma p{font-size:1.15rem}.diploma .seal{font-size:4rem}.final-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px auto}.hidden{display:none!important}@media print{body{background:white!important}.scene{background:white!important;padding:0!important;min-height:100vh!important}.scene:before,.scene:after,.spark,.float-pumpkin,.confetti,.final-controls,.header,.final-stage,.character{display:none!important}.layout{width:100%!important}.diploma{display:block!important;box-shadow:none!important;margin:35px auto!important;max-width:90%!important;break-inside:avoid}.credit{color:#45244d!important;text-shadow:none!important}}
</style></head><body><div id="app"></div><audio id="bgm" src="music.wav" preload="auto" loop></audio><audio id="finalMusic" src="finale.wav" preload="auto"></audio><script>
const rooms=[
{title:'La sala degli inviti',icon:'✉️',intro:'Cinque buste magiche custodiscono il primo indizio. Risolvi le addizioni per aprirle!',type:'add',tasks:[[47,35],[68,24],[56,27],[75,16],[124,38]],clue:'Cerca dove Pipi riposa a testa in giù…'},
{title:'La soffitta di Pipi',icon:'🦇',intro:'Accendi cinque lanterne misteriose con le sottrazioni e trova il secondo indizio!',type:'sub',tasks:[[84,37],[153,25],[152,28],[136,19],[174,26]],clue:'Segui la melodia della zucca che canta!'},
{title:'La sala della musica',icon:'🎃',intro:'Martina ha perso sei note musicali. Ritrovale con le tabelline del 2, 3, 4 e 5 e la proprietà commutativa!',type:'mult',tasks:[['2 × 7',14,'Conta di due in due per sette volte.'],['3 × 6',18,'Conta di tre in tre per sei volte.'],['4 × 8',32,'Puoi sommare 8 quattro volte.'],['5 × 9',45,'Conta di cinque in cinque per nove volte.'],['3 × 4 = 4 × ?',3,'La proprietà commutativa permette di scambiare i fattori.'],['5 × 2 = ? × 5',2,'Quale fattore si è spostato?']],clue:'La chiave è nascosta nella dispensa incantata!'},
{title:'La dispensa incantata',icon:'🗝️',intro:'Per ritrovare la chiave risolvi quattro problemi. Scegli se serve un’addizione o una sottrazione!',type:'story',tasks:[['Casimiro ha preparato 125 biscotti. Caramello ne aggiunge altri 38. Quanti biscotti ci sono in tutto?','+',163,'Le quantità si uniscono. 5 + 8 richiede un riporto.'],['Pipi ha appeso 172 decorazioni. Il vento ne fa cadere 26. Quante decorazioni restano?','−',146,'Le decorazioni diminuiscono. Per 2 − 6 devi cambiare una decina.'],['Martina prepara 46 dolcetti alla zucca e 28 al cioccolato. Quanti dolcetti ha preparato in tutto?','+',74,'Metti insieme i dolcetti. 6 + 8 richiede un riporto.'],['Sono stati gonfiati 153 palloncini. Durante i preparativi, 27 si sgonfiano. Quanti palloncini rimangono?','−',126,'I palloncini diminuiscono. Per 3 − 7 devi cambiare una decina.']],clue:'Hai trovato la chiave! La festa è salva!'}];
let name='',klass='',room=0,step=0,chosen='',mistakes=0,audioOn=true,musicOn=true,stats=[];const app=document.getElementById('app'),bgm=document.getElementById('bgm'),finalMusic=document.getElementById('finalMusic');let lyricTimer=null;bgm.volume=.23;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sounds={bad:new Audio('ghost.wav'),good:new Audio('applause.wav'),magic:new Audio('magic.wav'),door:new Audio('door.wav')};
function sfx(n){if(!audioOn)return;let a=sounds[n];if(!a)return;try{a.pause();a.currentTime=0;a.volume=n==='bad'?1:1;a.play().catch(e=>audioError('Audio non riproducibile: '+e.message))}catch(e){audioError('Errore audio: '+e.message)}}
function playGood(){sfx('good');if(audioOn)setTimeout(()=>sfx('magic'),450)}
function music(){if(!audioOn||!musicOn){bgm.pause();return}bgm.volume=.55;bgm.play().catch(e=>audioError('Musica non riproducibile: '+e.message))}
function toggleAudio(){audioOn=!audioOn;if(!audioOn){bgm.pause();finalMusic.pause()}else{if(document.getElementById('songLine'))finalMusic.play().catch(()=>{});else music()}renderAudio()}
function toggleMusic(){musicOn=!musicOn;music();renderAudio()}
function audioError(message){let el=document.getElementById('audioStatus');if(el)el.textContent=message;else console.warn(message)}
function testSound(){audioOn=true;musicOn=false;bgm.pause();renderAudio();let status=document.getElementById('audioStatus');if(status)status.textContent='Test: verso del fantasma, poi applauso e scoppio magico…';sfx('bad');setTimeout(()=>sfx('good'),1600);setTimeout(()=>sfx('magic'),4200)}
function renderAudio(){document.querySelectorAll('.audioBtn').forEach(b=>b.textContent=audioOn?'🔊 Suoni':'🔇 Suoni');document.querySelectorAll('.musicBtn').forEach(b=>b.textContent=musicOn?'🎵 Musica':'🎵 Off')}
function particles(){let a='';for(let i=0;i<16;i++){a+=`<span class="spark" style="--x:${(i*47+17)%100}%;--size:${12+i%4*5}px;--dur:${9+i%6*2}s;--delay:-${i*1.3}s">${['✨','🍂','✦','🎃'][i%4]}</span>`}return a}
function shell(content,scene=room+1){let bg=scene===0?'intro.jpg':`room${scene}.jpg`;app.innerHTML=`<div class="scene" style="--bg:url('${bg}')">${particles()}<div class="layout">${content}</div><div class="float-pumpkin">🎃</div></div>`}
function header(){return `<div class="header"><span class="badge">${esc(name)} · ${esc(klass)} · Missione ${room+1}/4</span><div class="controls"><button class="button alt tiny audioBtn" onclick="toggleAudio()">🔊 Suoni</button><button class="button alt tiny musicBtn" onclick="toggleMusic()">🎵 Musica</button></div></div>`}
function welcome(){shell(`<div class="panel intro-panel"><h1 class="title">CASIMIRO<br>& CARAMELLO</h1><p class="subtitle">🗝️ Il mistero della chiave scomparsa</p><p>Aiuta i fantasmini a salvare la festa di Halloween!</p><label for="name"><strong>Come ti chiami?</strong></label><br><input class="input" id="name" maxlength="30" placeholder="Scrivi il tuo nome" autocomplete="off"><p><strong>Qual è la tua classe?</strong></p><div class="buttons" id="classes"><button class="button choice" onclick="chooseClass('3ª B')">3ª B</button><button class="button choice" onclick="chooseClass('3ª C')">3ª C</button><button class="button choice" onclick="chooseClass('3ª D')">3ª D</button></div><button class="button" onclick="start()">▶ Inizia l’avventura</button><p><button class="button alt" onclick="testSound()">🔊 PROVA I SUONI</button></p><p id="audioStatus" class="status" role="status">Premi «Prova i suoni» per sentire il fantasma e gli applausi.</p><p id="status" class="status" role="status"></p><p class="credit">Maestra Giusi P. ♡</p></div><div class="character">👻</div><div class="character two">👻</div>`,0);document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')start()})}
function chooseClass(k){klass=k;document.querySelectorAll('#classes button').forEach(b=>b.classList.toggle('selected',b.textContent===k))}
function start(){let n=document.getElementById('name').value.trim();if(!n||!klass){document.getElementById('status').textContent='Scrivi il nome e scegli la classe.';return}name=n;room=step=mistakes=0;stats=[];music();sfx('door');intro()}
function intro(){let r=rooms[room];shell(`${header()}<div class="panel"><div class="success-burst">${r.icon}</div><p class="badge">MISSIONE ${room+1}</p><h1 class="title">${r.title}</h1><div class="question">${r.intro}</div><button class="button" onclick="play()">Comincia la missione ▶</button><p class="credit">Maestra Giusi P. ♡</p></div><div class="character">${r.icon}</div>`)}
function chooseOp(v){chosen=v;document.getElementById('plus').classList.toggle('selected',v==='+');document.getElementById('minus').classList.toggle('selected',v==='−')}
function play(){let r=rooms[room],t=r.tasks[step],expr=r.type==='add'?`${t[0]} + ${t[1]}`:r.type==='sub'?`${t[0]} − ${t[1]}`:r.type==='mult'?t[0]:'';chosen='';shell(`${header()}<div class="panel"><p class="badge">${r.icon} ${r.title}</p><div class="track">${r.tasks.map((_,i)=>`<span class="dot ${i<=step?'done':''}"></span>`).join('')}</div><p>Enigma ${step+1} di ${r.tasks.length}</p><div class="question">${r.type==='story'?esc(t[0]):`<div class="math">${esc(expr)} = ?</div>`}</div>${r.type==='story'?`<p>Quale operazione scegli?</p><div class="buttons"><button id="plus" class="button choice" onclick="chooseOp('+')">➕ Addizione</button><button id="minus" class="button choice" onclick="chooseOp('−')">➖ Sottrazione</button></div>`:''}<label for="answer">Scrivi il risultato</label><br><input class="input" id="answer" type="number" inputmode="numeric" placeholder="?" aria-label="Risultato"><br><button class="button" onclick="check()">✨ Conferma</button><div class="buttons"><button class="button alt" onclick="hint()">💡 Aiutami</button>${r.type==='add'||r.type==='sub'?'<button class="button alt" onclick="columns()">📐 Incolonna</button>':''}</div><div id="help" aria-live="polite"></div><p id="status" class="status" role="status"></p></div><div class="character">${r.icon}</div>`);document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
function hintText(){let r=rooms[room],t=r.tasks[step];if(r.type==='mult')return t[2];if(r.type==='story')return t[3];let u=t[0]%10,v=t[1]%10;return r.type==='add'?`${u} + ${v} = ${u+v}. Scrivi ${(u+v)%10} nelle unità e riporta una decina.`:`${u} unità non bastano per togliere ${v}. Cambia una decina in 10 unità.`}
function hint(){document.getElementById('help').innerHTML=`<div class="info feedback">🦇 Pipi ti suggerisce: ${hintText()} Riprova!</div>`}
function columns(){let t=rooms[room].tasks[step],cells=[Math.floor(t[0]/100)||'',Math.floor(t[0]/10)%10,t[0]%10,Math.floor(t[1]/100)||'',Math.floor(t[1]/10)%10,t[1]%10];document.getElementById('help').innerHTML=`<div class="info"><strong>Incolonna con h, da, u</strong><div class="grid"><span class="head">h</span><span class="head">da</span><span class="head">u</span>${cells.map(c=>`<span>${c}</span>`).join('')}</div>Puoi usare carta e matita!</div>`}
function check(){let r=rooms[room],t=r.tasks[step],v=document.getElementById('answer').value,expected=r.type==='add'?t[0]+t[1]:r.type==='sub'?t[0]-t[1]:r.type==='mult'?t[1]:t[2];if(v.trim()===''){document.getElementById('status').textContent='Scrivi il risultato!';return}if(r.type==='story'&&!chosen){document.getElementById('status').textContent='Scegli anche l’operazione!';return}if(Number(v)!==expected||(r.type==='story'&&chosen!==t[1])){mistakes++;sfx('bad');document.getElementById('status').textContent='👻 Uuuuh! Riprova, puoi farcela!';hint();return}stats.push({room:room+1,step:step+1,mistakes});mistakes=0;playGood();document.querySelector('.panel').innerHTML=`<div class="success-burst">🎉✨🎉</div><h1 class="title">BEN FATTO!</h1><div class="question">Risposta corretta! ${r.type==='add'?'La busta si apre!':r.type==='sub'?'La lanterna si illumina!':r.type==='mult'?'La nota magica risuona!':'Lo scrigno brilla!'}</div><button class="button" onclick="advance()">Continua ➜</button>`}
function advance(){if(step+1===rooms[room].tasks.length)clue();else{step++;play()}}
function clue(){sfx('door');let r=rooms[room];shell(`${header()}<div class="panel"><div class="success-burst">🌟${r.icon}🌟</div><h1 class="title">Missione completata!</h1><div class="question">${r.clue}</div><button class="button" onclick="next()">${room===3?'Apri la dispensa 🗝️':'Vai alla prossima stanza ➜'}</button></div>`)}
function next(){if(room===3)finish();else{room++;step=0;intro()}}
const songLines=['Uno, due, tre, che magia! ✨','La chiave è nostra, che allegria! 🗝️','Con i numeri e un po’ d’ingegno, 🔢','abbiam risolto ogni mistero! 👻','Batti le mani, vola anche tu, 👏','con Pipi e i fantasmi, su, su, su! 🦇'];
function finaleConfetti(){let h='';for(let i=0;i<40;i++)h+=`<span class="confetti" style="--left:${(i*37)%100}%;--sz:${12+i%4*7}px;--speed:${3+i%4}s;--delay:-${i*.17}s">${['🎊','✨','⭐','🎉'][i%4]}</span>`;return h}
function stopFinalSong(){if(lyricTimer){clearInterval(lyricTimer);lyricTimer=null}finalMusic.pause();finalMusic.currentTime=0}
function playFinalSong(){stopFinalSong();bgm.pause();let line=0;let el=document.getElementById('songLine');if(!el)return;el.textContent=songLines[0];if(audioOn){finalMusic.volume=.9;finalMusic.play().catch(e=>audioError('Non riesco a riprodurre la musica finale: '+e.message))}lyricTimer=setInterval(()=>{line++;if(line>=songLines.length){clearInterval(lyricTimer);lyricTimer=null;el.textContent='🎉 Ben fatto! La festa è salva! 🎉';return}el.textContent=songLines[line]},3300)}
function finish(){playGood();bgm.pause();shell(`${finaleConfetti()}<div class="panel" style="max-width:780px"><div class="final-stage"><h1 class="title final-title">🎉 FESTA SALVATA! 🎉</h1><div class="final-characters"><span title="Casimiro">👻</span><span title="Caramello">👻</span><span title="Pipi">🦇</span><span title="Martina">🎃</span></div><div class="lyric" id="songLine" aria-live="polite">La festa sta per cominciare!</div><p>La chiave è stata ritrovata! È il momento di festeggiare, ${esc(name)}!</p><div class="final-controls"><button class="button gold" onclick="playFinalSong()">🎵 Riascolta la canzoncina</button><button class="button" onclick="showDiploma()">🏅 Il mio diploma</button><button class="button alt" onclick="reset()">↻ Rigioca</button></div><p class="credit">Maestra Giusi P. ♡</p></div></div><div id="diploma" class="diploma hidden"><div class="seal">🏅🎃🏅</div><h2>DIPLOMA DEL CORAGGIO MATEMATICO</h2><p>Conferito a</p><div class="recipient">${esc(name)}</div><p>Classe <strong>${esc(klass)}</strong></p><p>Per aver risolto le quattro missioni, ritrovato la chiave magica<br>e salvato la festa di Halloween!</p><h2>BEN FATTO!</h2><p>👻 Casimiro · 👻 Caramello · 🦇 Pipi · 🎃 Martina</p><p><strong>Maestra Giusi P.</strong></p></div><div id="printControls" class="final-controls hidden"><button class="button gold" onclick="window.print()">🖨️ Stampa / Salva in PDF</button><button class="button alt" onclick="hideDiploma()">↩ Torna alla festa</button></div>`,4);setTimeout(playFinalSong,700)}
function showDiploma(){stopFinalSong();document.querySelector('.final-stage').classList.add('hidden');document.getElementById('diploma').classList.remove('hidden');document.getElementById('printControls').classList.remove('hidden')}
function hideDiploma(){document.querySelector('.final-stage').classList.remove('hidden');document.getElementById('diploma').classList.add('hidden');document.getElementById('printControls').classList.add('hidden')}
function reset(){stopFinalSong();name='';klass='';bgm.pause();bgm.currentTime=0;welcome()}
welcome();
</script></body></html>
